name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建组件库
        run: npm run build

      - name: 平台安全静态检查
        run: npm run check

      - name: 生成浏览器预览页
        run: node scripts/build-preview.mjs

      - name: 校验产物
        run: |
          test -f miniprogram_dist/index.js
          test -f miniprogram_dist/button/index.wxml
          test -f preview/index.html
          echo "组件数：$(ls -d miniprogram_dist/*/ | wc -l)"
          echo "产物体积：$(du -sh miniprogram_dist | cut -f1)"
